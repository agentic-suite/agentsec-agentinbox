name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (standalone, no runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip check

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type-check (mypy --strict)
        run: python -m mypy

      - name: Tests + coverage (>=95%)
        run: |
          python -m pytest \
            --cov=agentinbox \
            --cov-report=term-missing \
            --cov-fail-under=95

  security:
    name: security (packs + evidence scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (standalone, no runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Attack packs (release-blocking)
        run: python -m agentinbox.packs
      - name: Evidence scanner self-test (seeded leak must fail)
        run: python -m agentinbox.scanner --self-test
      - name: Claims lint (PRD 20 §G vocabulary)
        run: python -m agentinbox.claimslint
      - name: Release evidence scan (zero secrets)
        run: |
          python -m agentinbox.scanner --path docs/release/v0.1.0
          python -m agentinbox.scanner --path docs/field-test/v0.1.0
          python -m agentinbox.scanner --path field-test/v0.1.0/results
      - name: Invariants, timing, hardening, posture
        run: python -m pytest tests/security -q
      - name: Own posture (no-ML manifest + security.txt)
        run: |
          python -m agentinbox.posture manifest
          python -m agentinbox.posture security-txt

  install-smoke:
    name: install smoke (console script + python -m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Both entry points work
        run: |
          agentinbox --version
          python -m agentinbox --version
          agentinbox --help > /dev/null
          python -m agentinbox --help > /dev/null
