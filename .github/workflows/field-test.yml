name: field-test
on:
  pull_request:
    paths:
      - "agentinbox/**"
      - "tests/**"
      - "scripts/fieldtest/**"
      - "docs/field-test/**"
  push:
    branches: [main, "feat-**"]

permissions:
  contents: read

jobs:
  field-test:
    # The deterministic M32 leg: the 51 suite-backed cases run in Docker; the
    # study + Tier-1 harness cases are BLOCKED by environment (no humans, no
    # host CLIs on the runner) and are asserted as such — never skipped silently.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint + types
        run: |
          ruff check .
          mypy

      - name: Verify the field-test verifier
        run: python3 scripts/fieldtest/verify_harness.py

      - name: Deterministic field matrix (Docker SUT)
        run: |
          # The BLOCKED environment cases (study, Tier-1) stay blocked in CI;
          # run-all exits non-zero while any case is BLOCKED, so run the
          # deterministic suites explicitly and assert their verdicts.
          bash scripts/fieldtest/stack-ft.sh up
          rc=0
          for s in s0-core s1-cross-channel s2-escalation s3-flood s4-ci \
                   s5-evidence s6-attacks s7-governance s8-readiness \
                   s9-constrained s10-operations s11-outcomes s12-grants \
                   s13-insights s16-live; do
            bash scripts/fieldtest/run-suite.sh "$s" || rc=1
          done
          exit $rc

      - name: Deep verification + leak gate
        run: |
          python3 scripts/fieldtest/check_grounding.py field-test/v0.1.0/results --strict
          python3 scripts/fieldtest/scan_results.py field-test/v0.1.0/results --quiet

      - name: Blocked register (assert, never skip)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("field-test/v0.1.0/results")
          blocked = []
          if root.exists():
              for path in root.glob("*/cases/*/verdict.json"):
                  verdict = json.loads(path.read_text(encoding="utf-8"))
                  if verdict.get("status") == "blocked":
                      blocked.append((verdict["id"], verdict.get("limitation", "")))
          print("BLOCKED cases (expected: study + Tier-1 in CI):")
          for case_id, reason in blocked:
              print(f"  {case_id}: {reason}")
          PY

      # The hand-maintained report is never written by automation
      # (agentinbox/report_guard.py + AGENTS.md). CI never touches it.
      - name: Assert the hand-maintained report is untouched
        run: |
          git diff --exit-code docs/field-test/v0.1.0/FIELD_TEST_REPORT.md \
            || { echo "::error::CI must never modify FIELD_TEST_REPORT.md"; exit 1; }